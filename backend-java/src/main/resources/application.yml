spring:
  application:
    name: lesson-web-poc-java
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lesson_web}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:lesson_web}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: 10012

lesson:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  data-dir: ${DATA_DIR:../data/jobs}
  max-file-size: ${MAX_FILE_SIZE_MB:200}MB

mineru:
  api-key: ${MINERU_API_KEY:}
  base-url: ${MINERU_BASE_URL:https://mineru.net/api/v4}
  model-version: ${MINERU_MODEL_VERSION:vlm}
  language: ${MINERU_LANGUAGE:ch}
  poll-interval: ${MINERU_POLL_INTERVAL_SECONDS:3}s
  timeout: ${MINERU_TIMEOUT_SECONDS:600}s

logging:
  level:
    edu.jas: WARN

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
